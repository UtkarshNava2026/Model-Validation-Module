services:
  model-validation:
    build:
      context: .
      dockerfile: Dockerfile
    image: nava-vision-model-validation:latest
    container_name: nava-model-validation
    # Bind on all interfaces so same-WiFi devices can reach this laptop
    ports:
      - "0.0.0.0:${PORT:-7860}:7860"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./sample_data:/app/sample_data:ro
    environment:
      - PORT=7860
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Concurrent users: 3 on ~8GB GPU, raise to 4–6 on 16GB
      - MAX_SESSIONS=${MAX_SESSIONS:-3}
      - SESSION_TTL_SEC=${SESSION_TTL_SEC:-3600}
    gpus: all
    restart: unless-stopped
