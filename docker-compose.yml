services:
  model-validation:
    build:
      context: .
      dockerfile: Dockerfile
    image: nava-vision-model-validation:latest
    container_name: nava-model-validation
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./sample_data:/app/sample_data:ro
    environment:
      - PORT=7860
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
    restart: unless-stopped
